<!DOCTYPE html>
<html data-theme="light">
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.6/ace.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.6/ext-language_tools.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.6/ext-modelist.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.6/theme-tomorrow.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.6/theme-tomorrow_night.js"></script>
    <script src="k-ok.js"></script>
    <script src="oK.js"></script>
    <script src="convert.js"></script>
    <link rel="stylesheet" href="editor.css" />
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="newman.css" />
  </head>
  <body>
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2 class="ok-title" onclick="toggleManual()">oK</h2>
        <div class="header-actions">
          <button class="new-file-btn" onclick="createNewFile()">📄 New</button>
          <button class="theme-switch" id="themeSwitch" onclick="toggleTheme()">
            <span class="theme-icon sun-icon">☀️</span>
            <span class="theme-icon moon-icon">🌙</span>
          </button>
        </div>
      </div>
      <div class="files-list" id="filesList"></div>
    </div>

    <div class="main-wrapper">
      <div class="top-bar">
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
        <div class="mobile-header">
          <div style="display: flex; align-items: center; gap: 8px">
            <span
              style="cursor: pointer; user-select: none"
              onclick="toggleManual()"
              >⌘</span
            >
            <h2 id="mobileTitle"></h2>
          </div>
          <button class="icon-btn" onclick="openNotePopover()">➕</button>
          <div class="mobile-notes" id="mobileNotes"></div>
        </div>
      </div>
      <div class="main-content" id="mainContent">
        <div class="no-file-message">Select a file to view its contents</div>
      </div>
    </div>

    <div class="manual-popover" id="manualPopover">
      <button class="manual-close" onclick="toggleManual()">×</button>
      <div class="manual-content">
        <div class="nav-container">
          <div class="categories">
            <button class="category-btn active" data-category="monads">
              Monads
            </button>
            <button class="category-btn" data-category="dyads">Dyads</button>
            <button class="category-btn" data-category="adverbs">
              Adverbs
            </button>
            <button class="category-btn" data-category="control">
              Control
            </button>
            <button class="category-btn" data-category="types">Types</button>
            <button class="category-btn" data-category="system">System</button>
          </div>
        </div>
        <div id="content" class="cards-grid"></div>
      </div>
    </div>

    <div class="explanation-popover manual-popover" id="explanationPopover">
      <button class="manual-close" onclick="closeExplanation()">×</button>
      <div class="manual-content" id="explanationContent"></div>
    </div>

    <div class="overlay" id="overlay"></div>
    <div
      class="overlay sidebar-overlay"
      id="sidebarOverlay"
      onclick="closeSidebar()"
    ></div>

    <div class="edit-dialog" id="editDialog">
      <input type="text" id="fileNameInput" placeholder="File name" />
      <div class="dialog-actions">
        <button class="new-file-btn" onclick="closeDialog()">Cancel</button>
        <button class="new-file-btn" onclick="saveFileName()">Save</button>
      </div>
    </div>

    <div class="note-popover" id="notePopover">
      <input type="text" id="noteTitleInput" placeholder="Note title" />
      <textarea id="noteContentInput" placeholder="Note content"></textarea>
      <div class="dialog-actions">
        <button class="new-file-btn" onclick="closeNotePopover()">
          Cancel
        </button>
        <button class="new-file-btn" onclick="saveNote()">Save</button>
      </div>
    </div>

    <script src="newman.js"></script>
    <script src="index.js"></script>
  </body>
</html>
